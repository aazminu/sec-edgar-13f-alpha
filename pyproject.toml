[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-edgar-13f-alpha"
version = "0.2.0"
description = "SEC EDGAR 13F-HR institutional holdings & Form 4 insider transaction parser, CUSIP Mod-10 validator, crowding z-score engine, and temporal clone alpha backtester."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Azmi", email = "m4u5t4@u.northwestern.edu" }
]
keywords = ["sec-edgar", "13f-hr", "form-4", "cusip", "institutional-crowding", "quantitative-finance", "alpha-backtest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://abdullahazmi.com"
Repository = "https://github.com/aazminu/sec-edgar-13f-alpha"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
